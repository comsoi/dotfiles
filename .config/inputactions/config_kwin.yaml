# Get global shortcut list for KWin window manager in KDE
# Uses D-Bus interface to query shortcut configuration of org.kde.kglobalaccel service
# Returns all registered shortcut names in the KWin component
# qdbus org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component.shortcutNames
touchpad:
  gestures:
    - type: swipe
      gestures:
        - fingers: 2
          gestures:
            # 音量控制（右侧边缘）
            - direction: up_down
              conditions:
                - $finger_1_initial_position_percentage_x >= 0.9
                - $finger_2_initial_position_percentage_x >= 0.85
              actions:
                - on: update
                  interval: 15
                  input:
                    - keyboard: [volumedown]
                - on: update
                  interval: -15
                  input:
                    - keyboard: [volumeup]
            # 亮度控制（左侧边缘）
            - direction: up_down
              conditions:
                - $finger_1_initial_position_percentage_x <= 0.1
                - $finger_2_initial_position_percentage_x <= 0.15
              actions:
                - on: update
                  interval: 15
                  input:
                    - keyboard: [brightnessdown]
                - on: update
                  interval: -15
                  input:
                    - keyboard: [brightnessup]
        - fingers: 2
          gestures:
            # 移动窗口（Meta/Alt 键）
            - direction: any
              conditions:
                - any:
                  - $keyboard_modifiers == meta
                  - $keyboard_modifiers == alt
              actions:
                - on: begin
                  input:
                    - keyboard: [+leftmeta]
                    - mouse: [+left]
                - on: update
                  input:
                    - mouse: [move_by_delta]
                - on: end_cancel
                  input:
                    - keyboard: [-leftmeta]
                    - mouse: [-left]
            # 调整窗口（Meta+Alt 键）
            - direction: any
              conditions:
                - $keyboard_modifiers == [meta,alt]
              actions:
                - on: begin
                  input:
                    - keyboard: [+leftmeta]
                    - mouse: [+right]
                - on: update
                  input:
                    - mouse: [move_by_delta]
                - on: end_cancel
                  input:
                    - keyboard: [-leftmeta]
                    - mouse: [-right]
        # - fingers: 4
        #   gestures:
        #     - direction: up
        #       actions:
        #         - on: begin
        #           one:
        #             - plasma_shortcut: kwin,Window Maximize
        #               conditions:
        #                 - all:
        #                   - $window_maximized != true 
        #                   - $window_fullscreen != true
        #             - plasma_shortcut: kwin,Overview
        - fingers: 4
          gestures:
            - direction: down
              actions:
                - on: begin
                  one:
                    - plasma_shortcut: kwin,Window Minimize
                      conditions:
                        - $window_maximized == false
                        - $window_fullscreen == false
                        - $window_class != plasmashell
                    - plasma_shortcut: kwin,ExposeAll

    - type: pinch
      gestures:
        - fingers: 4
          gestures:
            - direction: in
              actions:
                - on: begin
                  one:
                    - plasma_shortcut: kwin,Window Fullscreen
                      conditions:
                        - $window_fullscreen == true
                    - plasma_shortcut: kwin,Window Maximize
                      conditions:
                        - $window_maximized == true
                    - plasma_shortcut: kwin,Expose
        - fingers: 4
          gestures:
            - direction: out
              actions:
                - on: begin
                  one:
                    - plasma_shortcut: kwin,Window Maximize
                      conditions:
                        - all:
                          - $window_maximized != true 
                          - $window_fullscreen != true
                    - plasma_shortcut: kwin,Window Maximize
                      conditions:
                        - $window_maximized == true
    - type: stroke
      gestures:
      - fingers: 3
        gestures:
        - strokes: 'BQAAMQVgNAFeZGQA'
          actions:
            - plasma_shortcut: kwin,Window Close
            - command: hyprctl dispatch killactive
        - strokes: 'MQoAMTFkL88yAGQA'
          actions:
            - command: runapp -i app.slice dolphin || dolphin

mouse:
  gestures:
    - type: stroke
      mouse_buttons: [right]
      conditions:
        - $keyboard_modifiers == alt
      gestures:
        - strokes: 'MQoAMTFkL88yAGQA'
          actions:
            - command: dolphin
        - strokes: 'BQAAMQVgNAFeZGQA'
          actions:
            - plasma_shortcut: kwin,Window Close
    - type: wheel
      direction: up_down
      conditions:
        - $keyboard_modifiers == meta
      actions:
        - on: update
          interval: '+'
          plasma_shortcut: kwin,Switch to Next Desktop
        - on: update
          interval: '-'
          plasma_shortcut: kwin,Switch to Previous Desktop
    - type: wheel
      direction: up_down
      conditions:
        - $keyboard_modifiers == [meta,shift]
      actions:
        - on: update
          interval: '+'
          plasma_shortcut: kwin,Window to Next Desktop
        - on: update
          interval: '-'
          plasma_shortcut: kwin,Window to Previous Desktop
    - type: wheel
      direction: up_down
      conditions:
        - $keyboard_modifiers == [meta,alt]
      actions:
        - on: update
          interval: '+'
          plasma_shortcut: kwin,Decrease Opacity
        - on: update
          interval: '-'
          actions:
          plasma_shortcut: kwin,Increase Opacity

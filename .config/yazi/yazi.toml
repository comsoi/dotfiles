[mgr]
show_hidden = true
linemode = "size"

[preview]
wrap = "yes"
tab_size = 2
max_width = 6000
max_height = 6000
image_delay = 0

[tasks]
image_bound      = [ 10000, 10000 ]

[[plugin.prepend_fetchers]]
id = "git"
name = "*"
run = "git"

[[plugin.prepend_fetchers]]
id = "git"
name = "*/"
run = "git"

[opener]
edit = [
	{ run = "$EDITOR %s", block = true, for = "unix" },
	{ run = "%EDITOR% %s", block = true, for = "windows" },
]
open = [
	{ run = "xdg-open %s", desc = "Open" },
]

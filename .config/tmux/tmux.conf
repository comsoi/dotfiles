set -ga update-environment WEZTERM_CONFIG_DIR
set -ga update-environment WEZTERM_UNIX_SOCKET
set -ga update-environment WEZTERM_CONFIG_FILE
set -ga update-environment WEZTERM_PANE
set -ga update-environment WEZTERM_EXECUTABLE_DIR
set -ga update-environment ALACRITTY_SOCKET
set -ga update-environment ALACRITTY_LOG
set -ga update-environment ALACRITTY_WINDOW_ID
set -ga update-environment KITTY_PID
set -ga update-environment KITTY_PUBLIC_KEY
set -ga update-environment KITTY_INSTALLATION_DIR
set -ga update-environment KITTY_LISTEN_ON
set -ga update-environment KITTY_WINDOW_ID
set -ga update-environment KONSOLE_VERSION
set -ga update-environment ITERM_SESSION_ID
set -ga update-environment WEZTERM_EXECUTABLE
set -ga update-environment GHOSTTY_RESOURCES_DIR
set -ga update-environment WT_Session
set -ga update-environment VSCODE_INJECTION
set -ga update-environment TABBY_CONFIG_DIRECTORY
set -ga update-environment KITTY_WINDOW_ID
set -ga update-environment KONSOLE_VERSION
set -ga update-environment ITERM_SESSION_ID
set -ga update-environment WEZTERM_EXECUTABLE
set -ga update-environment GHOSTTY_RESOURCES_DIR
set -ga update-environment WT_Session
set -ga update-environment VSCODE_INJECTION
set -ga update-environment TABBY_CONFIG_DIRECTORY

set -ga update-environment DISPLAY
set -ga update-environment WAYLAND_DISPLAY
set -ga update-environment XDG_CURRENT_DESKTOP
set -ga update-environment XDG_SESSION_DESKTOP
set -ga update-environment XDG_SESSION_CLASS
set -ga update-environment XDG_SESSION_ID
set -ga update-environment XDG_SESSION_TYPE
set -ga update-environment XDG_MENU_PREFIX
set -ga update-environment XDG_CONFIG_DIRS
set -ga update-environment XDG_SEAT
set -ga update-environment XDG_VTNR

set  -g  default-command    "/usr/bin/env zsh"
set      default-terminal   "tmux-256color"
set  -a  terminal-features "*:usstyle:strikethrough:256:RGB:sixel:hyperlinks:clipboard"
set -s set-clipboard on

set  -g  history-limit     50000
set  -sg escape-time       5
set  -s  extended-keys     on
set  -g  mouse             on

# setw -g  window-size       smallest
setw -g  aggressive-resize on

# don't do anything when a 'bell' rings
set  -g visual-activity    off
set  -g visual-bell        off
set  -g visual-silence     off
set  -g bell-action        none
setw -g monitor-activity   off

if-shell -b '[ "$(echo "$(echo "$TERM_PROGRAM_VERSION" | sed "s/[^0-9.]//g") >= 3.3" | bc)" = 1 ]' \
	"set  -gq allow-passthrough on"

# index
set  -g  base-index        1   # start window numbering at 1
setw -g  pane-base-index   1   # start pane numbering at 1
set  -g  renumber-windows  on
setw -g  automatic-rename  on
set  -g  set-titles        on

# style
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

run ~/.config/tmux/plugins/tmux-catppuccin/catppuccin.tmux

set -g   status-right-length 100
set -g   status-left-length  100
set -g   status-left  "#{?window_zoomed_flag,Z,}"
set -g   status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag  status-right "#{E:@catppuccin_status_session}"
set -ag  status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

run ~/.config/tmux/plugins/tmux-battery/battery.tmux
run ~/.config/tmux/plugins/tmux-cpu/cpu.tmux
# run ~/.config/tmux/plugins/tmux-yank/yank.tmux

source-file ~/.config/tmux/keybindings.tmux




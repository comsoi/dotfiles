# ==============================================================================
# tmux.conf —— 入口（语法兼容到 1.8）
#
# 结构：
#   conf/env.tmux                环境变量清理 + update-environment
#   conf/options.tmux            终端与通用核心选项
#   conf/keys/prefix.tmux        前缀 / 模式 / 拆分
#   conf/keys/window.tmux        窗口键位
#   conf/keys/pane.tmux          窗格键位（含 nvim 检测的 ps 兜底版）
#   conf/keys/session.tmux       会话 / 其他键位
#   conf/v3/options.tmux         3.0+ 新选项与 terminal-features
#   conf/v3/statusline.tmux      catppuccin + cpu/battery 状态栏
#   conf/v3/smart-splits.tmux    smart-splits.nvim 集成（覆盖 ps 兜底版）
#   conf/v3/copy-mode.tmux       复制模式定制
#   conf/v3/suspend.tmux         F12 挂起 / 恢复
#   conf/legacy.tmux             <3.0 兜底
#
# 兼容原则：
#   - 特殊按键一律加引号（"\\"、'M-{'），新旧配置解析器行为一致
#   - 新选项一律带 -q 或收进 conf/v3/，旧版本静默跳过
#   - 版本判断统一用 #{version} + sort -V，不依赖 TERM_PROGRAM_VERSION / bc
# ==============================================================================

source-file ~/.config/tmux/conf/env.tmux
source-file ~/.config/tmux/conf/options.tmux

source-file ~/.config/tmux/conf/keys/prefix.tmux
source-file ~/.config/tmux/conf/keys/window.tmux
source-file ~/.config/tmux/conf/keys/pane.tmux
source-file ~/.config/tmux/conf/keys/session.tmux

# 版本闸门：3.0 起加载 v3 层
# 用 #{version}（服务端自身版本，2.6+ 支持，更早版本展开为空 -> 走 legacy），
# 不用 tmux -V（嵌套/多版本共存时 PATH 里的 tmux 可能不是当前服务端）；
# 不用 -b：同步执行保证 v3 层的覆盖绑定在启动时按序生效
if-shell '[ -n "#{version}" ] && [ "$(printf "3.0\n%s\n" "#{version}" | sed -E "s/[^0-9.].*$//" | sort -V | head -n1)" = "3.0" ]' " \
    source-file ~/.config/tmux/conf/v3/options.tmux; \
    source-file ~/.config/tmux/conf/v3/statusline.tmux; \
    source-file ~/.config/tmux/conf/v3/smart-splits.tmux; \
    source-file ~/.config/tmux/conf/v3/copy-mode.tmux; \
    source-file ~/.config/tmux/conf/v3/suspend.tmux" \
    'source-file ~/.config/tmux/conf/legacy.tmux'

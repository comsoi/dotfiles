# hypridle.conf

general {
	lock_cmd = hyprlock
	before_sleep_cmd = loginctl lock-session
	after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
	timeout = 20
	on-timeout = pidof hyprlock && ! systemd-ac-power && { hyprctl dispatch dpms off || wlopm --off '*'; }
	on-resume = hyprctl dispatch dpms on || wlopm --on '*'
}

# on battery power
listener {
	timeout = 300
	on-timeout = systemd-ac-power || brightnessctl -s set --min-value=75 40%-
	on-resume = brightnessctl -r
}

listener {
	timeout = 600
	on-timeout = systemd-ac-power || brightnessctl -s set 10
	on-resume = brightnessctl -r
}

listener {
	timeout = 610
	on-timeout = systemd-ac-power || { hyprctl dispatch dpms off || wlopm --off '*'; }
	on-resume = hyprctl dispatch dpms on || wlopm --on '*'
}

listener {
	timeout = 620
	on-timeout = systemd-ac-power || loginctl lock-session
}

listener {
	timeout = 900
	on-timeout = systemd-ac-power || systemctl suspend
}

# on AC power
listener {
	timeout = 1440
	on-timeout = systemd-ac-power && brightnessctl -s set --min-value=100 40%-
	on-resume = brightnessctl -r
}

listener {
	timeout = 1500
	on-timeout = systemd-ac-power && loginctl lock-session
}


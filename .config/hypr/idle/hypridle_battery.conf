# hypridle.conf

general {
	lock_cmd = pidof hyprlock || hyprlock
	before_sleep_cmd = loginctl lock-session
	after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
	timeout = 20
	on-timeout = pidof hyprlock && ! systemd-ac-power && { hyprctl dispatch dpms off || wlopm --off '*'; }
	on-resume = hyprctl dispatch dpms on || wlopm --on '*'
}

listener {
	timeout = 300
	on-timeout = brightnessctl -s set --min-value=75 40%-
	on-resume = brightnessctl -r
}

listener {
	timeout = 600
	on-timeout = { hyprctl dispatch dpms off || wlopm --off '*'; }
	on-resume = hyprctl dispatch dpms on || wlopm --on '*'
}

listener {
	timeout = 620
	on-timeout = loginctl lock-session
}

listener {
	timeout = 900
	on-timeout = systemctl suspend
}

# hypridle.conf — merged power-aware config

$action = ~/.config/hypr/idle/action.sh

general {
	lock_cmd = pidof hyprlock || hyprlock
	before_sleep_cmd = loginctl lock-session
	after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# --- Battery timeline ---

listener {
	timeout = 20
	on-timeout = $action dpms-locked --battery
	on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
	timeout = 300
	on-timeout = $action dim --battery
	on-resume = brightnessctl -r
}

listener {
	timeout = 600
	on-timeout = $action dpms-off --battery
	on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
	timeout = 620
	on-timeout = $action lock --battery
}

listener {
	timeout = 900
	on-timeout = $action suspend --battery
}

# --- AC timeline ---

listener {
	timeout = 1200
	on-timeout = $action dpms-off --ac
	on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
	timeout = 1440
	on-timeout = $action dim --ac
	on-resume = brightnessctl -r
}

listener {
	timeout = 1500
	on-timeout = $action lock --ac
}

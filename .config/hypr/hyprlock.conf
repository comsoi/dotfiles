# hyprlock.conf

$HYPRSCRIPTS = ~/.config/hypr/scripts

general {
    ignore_empty_input = false
}

background {
	monitor =
	path = $HOME/.local/state/wallpaper/current_wallpaper
	path = screenshot
	blur_passes = 3
	contrast = 0.8916
	brightness = 0.8172
	vibrancy = 0.1696
	vibrancy_darkness = 0.0
}


label {
    monitor =
    #date
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.70)
    font_size = 178
    font_family = SF Pro Display Bold
    position = 0, -150
    halign = center
    valign = top
    shadow_passes = 5
    shadow_size = 10
}
label {
    monitor =
    text = cmd[update:1000] echo "$(LC_TIME=C date +"%A, %d %B")"
    color = rgba(216, 222, 233, 0.70)
    font_size = 33
    font_family = SF Pro Display Bold
    position = 0, -450
    halign = center
    valign = top
}

image {
    monitor =
    path = /var/lib/AccountsService/icons/$USER
    size = 180 # lesser side if not 1:1 ratio
    rounding = -1
    rotate = 0 # degrees, counter-clockwise
    reload_time = -1 # seconds between reloading, 0 to reload with SIGUSR2
#    reload_cmd =  # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.6
}
# USER
label {
    monitor =
    text = 
    color = rgba(216, 222, 233, 0.80)
    font_size = 42
    position = -100, -130
    halign = center
    valign = center
}
label {
    monitor =
    text = $DESC
    color = rgba(216, 222, 233, 0.80)
    font_size = 24
    font_family = SF Pro Display
    position = 30, -130
    halign = center
    valign = center
}
# USER-BOX
shape {
    monitor =
    size = 300, 60
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 0)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
		onclick = gdmflexiserver
    position = 0, -130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    invert_numlock = true # change color if numlock is off
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99">🔒 Enter Password...</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

# POWER WIDGET
# Reboot
label {
    monitor =
    text = 󰜉
    color = rgba(255, 255, 255, 0.6)
    font_size = 80
    onclick = reboot now
    position = 0, 100
    halign = center
    valign = bottom
}

# Power off
label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 0.6)
    font_size = 80
    onclick = shutdown now
    position = -160, 100
    halign =center
    valign = bottom
}

# Suspend
label {
    monitor =
    text = 󰤄
    color = rgba(255, 255, 255, 0.6)
    font_size = 80
    onclick = systemctl suspend
    position = 160, 100
    halign = center
    valign = bottom
}

# MUSIC PLAYER WIDGET
# PLAYER TITLE
label {
    monitor =
    text = cmd[update:1000] $HYPRSCRIPTS/music.sh --title
    color = rgba(255, 255, 255, 0.8)
    font_size = 24
    position = 10, 15
    halign = left
    valign = bottom
    zindex = 5
}

# PLAYER ARTIST
label {
    monitor =
    text = cmd[update:1000] $HYPRSCRIPTS/music.sh --artist
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    position = 10, 60
    halign = left
    valign = bottom
    zindex = 5
}

# PLAYER LENGTH
label {
    monitor =
    text = cmd[update:1000] $HYPRSCRIPTS/music.sh --length
    color = rgba(255, 255, 255, 1)
    font_size = 14
    position = 10, 90
    halign = left
    valign = bottom
    zindex = 5
}

# PLAYER SOURCE
label {
    monitor =
    text = cmd[update:1000] $HYPRSCRIPTS/music.sh --source
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    position = 10, 90
    halign = left
    valign = bottom
    zindex = 5
}

# Step Backward
label {
    monitor =
    text = cmd[update:1000] $HYPRSCRIPTS/music.sh --prev-icon
    onclick = playerctl previous
    color = rgba(216, 222, 233, 0.70)
    font_size = 32
    position = -60, -300
    halign = center
    valign = center
    zindex = 5
}

# PLAYER STATUS
label {
    monitor =
    text = cmd[update:1000] $HYPRSCRIPTS/music.sh --status
    onclick = playerctl play-pause
    color = rgba(216, 222, 233, 0.70)
    font_size = 32
    position = 0, -300
    halign = center
    valign = center
    zindex = 5
}

# Step Forward
label {
    monitor =
    text = cmd[update:1000] $HYPRSCRIPTS/music.sh --next-icon
    onclick = playerctl next
    color = rgba(216, 222, 233, 0.70)
    font_size = 32
    position = 60, -300
    halign = center
    valign = center
    zindex = 5
}


# Battery
label {
    monitor =
    text = cmd[update:1000] $HYPRSCRIPTS/battery.sh
    color = rgba(200, 200, 200, 1)
    font_size = 16
    halign = right
    valign = bottom
    zindex = 5
}

# Battery div
shape {
    monitor =
    size = 70, 35
    color = rgba(255, 255, 255, .1)
    rounding = 10
    rotate = 0
    halign = right
    valign = bottom
    zindex = 1
}

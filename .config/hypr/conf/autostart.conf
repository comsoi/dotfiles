# Notice: uwsm-app app daemon is failing on simultaneous requests

# Load Wallpaper
exec-once = waypaper --restore

# Load GTK settings
exec-once = $HYPRSCRIPTS/gtk.sh

# Load Xresources
exec-once = xrdb -merge ~/.Xresources

# Load cliphist history
exec-once = runapp -i background.slice -- wl-paste --watch cliphist store

# ALT-TAB
exec-once = runapp -i background-graphical.slice -- hyprswitch init --show-title

# Dock
exec-once = runapp -i background-graphical.slice -- ~/.config/nwg-dock-hyprland/nwg-dock-hyprland

# workspace init
exec-once = [workspace 2 silent] runapp -o -- zen
exec-once = [workspace 1 silent] runapp -o -- kitty -1

# for XF86PowerOff key

# hyprlang if XDG_RUNTIME_DIR
exec-once = systemd-inhibit --who="Hyprland config" --why="wlogout keybind" --what=handle-power-key --mode=block sleep infinity & echo $! > $XDG_RUNTIME_DIR/.hyprland-systemd-inhibit
exec-shutdown = kill -9 "$(cat $XDG_RUNTIME_DIR/.hyprland-systemd-inhibit)" && rm "$XDG_RUNTIME_DIR/.hyprland-systemd-inhibit"
# hyprlang endif

# exec-shutdown = ~/.config/hypr/scripts/logout.sh
exec-shutdown = cliphist wipe

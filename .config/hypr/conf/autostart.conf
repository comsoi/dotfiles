# Setup XDG for screen sharing and start waypaper and waybar
# exec-once = ~/.config/hypr/scripts/xdg.sh
# exec-once = uwsm finalize

# waybar
exec-once = ~/.config/waybar/launch.sh

# Start Polkit
# exec-once = uwsm app -- /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = systemctl --user start hyprpolkitagent

# Load Wallpaper
exec-once = ~/.config/hypr/scripts/wallpaper-restore.sh

# Using hypridle to start hyprlock
exec-once = uwsm app -- hypridle

# ALT-TAB
exec-once = uwsm app -- hyprswitch init --show-title &

# Load Notification Daemon
exec-once = uwsm app -- swaync

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Load QT settings
exec-once = ~/.config/hypr/scripts/qt.sh

# IME
exec-once = uwsm app -- /usr/bin/fcitx5 -d -r

# WLAN tray
exec-once = uwsm app -- /usr/bin/nm-applet --indicator

# XEMBED Support
exec-once = uwsm app -- /usr/bin/xembedsniproxy

exec-once = xrdb -merge ~/.Xresources

# Load cliphist history
exec-once = uwsm app -- wl-paste --watch cliphist store

# Dock
exec-once = ~/.config/nwg-dock-hyprland/launch.sh

exec-once = sleep 5; uwsm app -- zen
exec-once = [workspace 1 silent] uwsm app -- kitty -1

# for XF86PowerOff key
exec-once = systemd-inhibit --who="Hyprland config" --why="wlogout keybind" --what=handle-power-key --mode=block sleep infinity & echo $! > /tmp/.hyprland-systemd-inhibit
exec-shutdown = kill -9 "$(cat /tmp/.hyprland-systemd-inhibit)"

exec-shutdown = ~/.config/hypr/scripts/logout.sh
exec-shutdown = cliphist wipe


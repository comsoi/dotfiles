general {
	gaps_in = 10
	gaps_out = 14
	border_size = 2
	col.active_border = $primary
	col.inactive_border = $secondary_container
	resize_on_border = true
	allow_tearing = true
}

decoration {
	rounding = 10
	active_opacity = 1.0
	inactive_opacity = 0.9
	fullscreen_opacity = 1.0

	blur {
		enabled = true
		size = 6
		passes = 2
		# ignore_opacity = true
		# xray = true
	}

	shadow {
		enabled = true
		range = 30
		render_power = 3
		color = 0x66000000
	}
}

group {
	groupbar {
		height = 16
		indicator_height = 2
		font_size = 16
		col.active = $primary_container
		col.inactive = $secondary_container
		gaps_in = 10
	}
		# gap_tabbar = 0
	col.border_active = $primary
	col.border_inactive = $secondary_container
}

###############
### Windows ###
###############

bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill

# fullscreenstate: 1=maximize, 2=fullscreen, 3=maximize and fullscreen
bind = $mainMod      ,   F,         fullscreenstate, 2 1
bind = $mainMod CTRL ,   F,         fullscreen, 0
bind = $mainMod SHIFT,   F,         fullscreen, 1
bind = $mainMod,         page_up,   fullscreen, 1
bind = $mainMod,         page_down, fullscreen, 1

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod SHIFT, mouse_down, movefocus, l
bind = $mainMod SHIFT, mouse_up, movefocus, r

bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, L, movewindow, r
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, J, movewindow, d

bind = $mainMod ALT, H, swapwindow, l
bind = $mainMod ALT, L, swapwindow, r
bind = $mainMod ALT, K, swapwindow, u
bind = $mainMod ALT, J, swapwindow, d

bind = $mainMod SHIFT, l, resizeactive, 100 0
bind = $mainMod SHIFT, h, resizeactive, -100 0
bind = $mainMod SHIFT, j, resizeactive, 0 100
bind = $mainMod SHIFT, k, resizeactive, 0 -100

bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, left, resizeactive, -100 0
bind = $mainMod SHIFT, down, resizeactive, 0 100
bind = $mainMod SHIFT, up, resizeactive, 0 -100

bind = $mainMod, grave, swapactiveworkspaces, HDMI-A-1 eDP-1
bind = $mainMod, grave, swapactiveworkspaces, DP-1 eDP-1

bind = ALT, grave,  cyclenext
bind = ALT, grave,  bringactivetotop

# https://github.com/hyprwm/Hyprland/discussions/2517
bind = $mainMod, N, togglegroup
bind = $mainMod, J, changegroupactive, f
bind = $mainMod, K, changegroupactive, b

# Positioning mode
bind = $mainMod Ctrl, T, pin

bind = $mainMod Alt, Space, togglefloating
bind = $mainMod, T, togglefloating
bind = $mainMod SHIFT, T, exec, bash -c 'ws=$(hyprctl activeworkspace -j | jq -r .id); hyprctl clients -j | jq -r --arg ws "$ws" '"'"'.[] | select(.workspace.id == ($ws|tonumber)) | .address'"'"' | xargs -r -I {} hyprctl dispatch togglefloating address:{}'

# layoutmsg
# dwindle
bind = $mainMod, U, layoutmsg, swapsplit
bind = $mainMod, R, layoutmsg, togglesplit
bind = $mainMod, Minus, layoutmsg, splitratio -0.1
bind = $mainMod, Equal, layoutmsg, splitratio +0.1
# scrolling
bind = $mainMod, R, layoutmsg, promote
bind = $mainMod, Minus, layoutmsg, colresize -0.1
bind = $mainMod, Equal, layoutmsg, colresize +0.1

bind = $mainMod, I, pseudo
bind = $mainMod SHIFT, I, exec, bash -c 'ws=$(hyprctl activeworkspace -j | jq -r .id); hyprctl clients -j | jq -r --arg ws "$ws" '"'"'.[] | select(.workspace.id == ($ws|tonumber)) | .address'"'"' | xargs -r -I {} hyprctl dispatch pseudo address:{}'

bind = $mainMod, D, exec, $HYPRSCRIPTS/show-desktop.sh

binde = $mainMod CTRL, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.2')
binde = $mainMod CTRL, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
#################
### workspace ###
#################

bindit = ,Super_L, global, quickshell:workspaceNumber
bindit = ,Super_R, global, quickshell:workspaceNumber
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move all windows to workspace
bind = $mainMod CTRL, 1, exec, $HYPRSCRIPTS/moveTo.sh 1
bind = $mainMod CTRL, 2, exec, $HYPRSCRIPTS/moveTo.sh 2
bind = $mainMod CTRL, 3, exec, $HYPRSCRIPTS/moveTo.sh 3
bind = $mainMod CTRL, 4, exec, $HYPRSCRIPTS/moveTo.sh 4
bind = $mainMod CTRL, 5, exec, $HYPRSCRIPTS/moveTo.sh 5
bind = $mainMod CTRL, 6, exec, $HYPRSCRIPTS/moveTo.sh 6
bind = $mainMod CTRL, 7, exec, $HYPRSCRIPTS/moveTo.sh 7
bind = $mainMod CTRL, 8, exec, $HYPRSCRIPTS/moveTo.sh 8
bind = $mainMod CTRL, 9, exec, $HYPRSCRIPTS/moveTo.sh 9
bind = $mainMod CTRL, 0, exec, $HYPRSCRIPTS/moveTo.sh 10

bind = $mainMod, End, workspace, +1
bind = $mainMod, Home, workspace, -1
bind = $mainMod, Tab, workspace, m+1
bind = $mainMod SHIFT, Tab, workspace, m-1

bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

bind = $mainMod CTRL, down, workspace, e-1
bind = $mainMod CTRL, up, workspace, e+1
bind = $mainMod CTRL, left, workspace, -1
bind = $mainMod CTRL, right, workspace, +1

bind = $mainMod SHIFT CTRL, down, movetoworkspace, e-1
bind = $mainMod SHIFT CTRL, up, movetoworkspace, e+1
bind = $mainMod SHIFT CTRL, left, movetoworkspace, -1
bind = $mainMod SHIFT CTRL, right, movetoworkspace, +1

# special workspaces
bind = $mainMod,       X,  togglespecialworkspace, special
bind = $mainMod,       F1, togglespecialworkspace, w1
bind = $mainMod,       F2, togglespecialworkspace, w2
bind = $mainMod,       F3, togglespecialworkspace, w3
bind = $mainMod,       F4, togglespecialworkspace, w4
bind = $mainMod,       F5, togglespecialworkspace, w5

bind = $mainMod SHIFT, X,  movetoworkspace, special:special
bind = $mainMod SHIFT, F1, movetoworkspace, special:w1
bind = $mainMod SHIFT, F2, movetoworkspace, special:w2
bind = $mainMod SHIFT, F3, movetoworkspace, special:w3
bind = $mainMod SHIFT, F4, movetoworkspace, special:w4
bind = $mainMod SHIFT, F5, movetoworkspace, special:w5

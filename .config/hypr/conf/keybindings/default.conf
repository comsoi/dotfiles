# Windows
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill

bind = $mainMod, F, fullscreen, 0
bind = $mainMod, D, fullscreen, 1
bind = $mainMod, page_up, fullscreen, 1
bind = $mainMod, page_down, fullscreen, 1

bind = $mainMod, T, togglefloating
bind = $mainMod SHIFT, T, workspaceopt, allfloat 

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod CTRL, H, movewindow, l
bind = $mainMod CTRL, L, movewindow, r
bind = $mainMod CTRL, K, movewindow, u
bind = $mainMod CTRL, J, movewindow, d

bind = $mainMod ALT, H, swapwindow, l
bind = $mainMod ALT, L, swapwindow, r
bind = $mainMod ALT, K, swapwindow, u
bind = $mainMod ALT, J, swapwindow, d

bind = $mainMod SHIFT, l, resizeactive, 100 0
bind = $mainMod SHIFT, h, resizeactive, -100 0
bind = $mainMod SHIFT, j, resizeactive, 0 100
bind = $mainMod SHIFT, k, resizeactive, 0 -100

bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, left, resizeactive, -100 0
bind = $mainMod SHIFT, down, resizeactive, 0 100
bind = $mainMod SHIFT, up, resizeactive, 0 -100

bind = $mainMod, grave, swapactiveworkspaces, HDMI-A-1 eDP-1
bind = $mainMod, grave, swapactiveworkspaces, DP-1 eDP-1

bind = ALT, grave, cyclenext
bind = ALT, grave, bringactivetotop

bind = $mainMod, G, togglegroup

bind = $mainMod, U, swapsplit
bind = $mainMod, I, togglesplit

# Actions
bind = $mainMod CTRL, Q, exec, $HYPRSCRIPTS/wlogout.sh
bind = $mainMod, semicolon, exec, $HYPRSCRIPTS/power.sh lock

bind = $mainMod, V, exec, swaync-client -t
bind = $mainMod SHIFT, V, exec, $HYPRSCRIPTS/cliphist.sh                                  # Open clipboard manager
bind = $mainMod ALT, G, exec, $HYPRSCRIPTS/gamemode.sh                                    # Toggle game mode

# launchers
bind = $mainMod CTRL, RETURN, exec, pkill rofi || rofi -show drun -replace -i -run-command "uwsm app -- {cmd}"
bind = ALT, SPACE , exec, pkill rofi || rofi -show drun -replace -i -run-command "uwsm app -- {cmd}"

# screenshot
bind = , PRINT, exec, grimblast --notify --freeze copy screen
bind = SHIFT, PRINT, exec, grimblast --notify --freeze copy output
bind = $mainMod SHIFT, S, exec, $HYPRSCRIPTS/screenshot.sh                                # Take a screenshot

# wallpaper
bind = $mainMod SHIFT, W, exec, waypaper --random                                         # Change the wallpaper
bind = $mainMod CTRL, W, exec, waypaper                                                   # Open wallpaper selector
bind = $mainMod ALT, W, exec, $HYPRSCRIPTS/wallpaper-automation.sh                        # Start random wallpaper script

# dock
bind = SUPER, SUPER_L, exec, nwg-dock-hyprland

# waybar
bind = $mainMod SHIFT, B, exec, ~/.config/waybar/launch.sh                                # Reload waybar
bind = $mainMod CTRL, B, exec, ~/.config/waybar/toggle.sh                                 # Toggle waybar
bind = $mainMod CTRL ALT, B, exec, ~/.config/waybar/themeswitcher.sh                          # Open waybar theme switcher

# media keys
bind = CTRL ALT, p, exec, playerctl play-pause
bind = CTRL ALT, right, exec, playerctl next
bind = CTRL ALT, left, exec, playerctl previous
bind = CTRL ALT, up, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = CTRL ALT, down, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%


# Passthrough SUPER KEY to Virtual Machine
bind = SUPER CTRL ALT, V, submap, passthru
submap = passthru
bind = $mainMod, escape, submap, reset
bind = alt, escape, submap, reset
submap = reset


# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10%                                                                                                  # Increase brightness by 10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%-                                                                                                # Reduce brightness by 10%
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%                                                                                # Increase volume by 5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%                                                                                # Reduce volume by 5%
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle                                                                                     # Toggle mute
bind = , XF86AudioPlay, exec, playerctl play-pause                                                                                                           # Audio play pause
bind = , XF86AudioStop, exec, playerctl stop                                                                                                                 # Audio stop
bind = , XF86AudioPause, exec, playerctl pause                                                                                                               # Audio pause
bind = , XF86AudioNext, exec, playerctl next                                                                                                                 # Audio next
bind = , XF86AudioPrev, exec, playerctl previous                                                                                                             # Audio previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle                                                                               # Toggle microphone
bind = , XF86PowerOff, exec, $HYPRSCRIPTS/wlogout.sh
bind = , XF86Lock, exec, hyprlock                                                                                                                            # Open screenlock

bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10-


# Applications
$BROWSER = zen-browser.desktop
$EDITOR = code.desktop
$EMOJIPICKER = it.mijorus.smile.desktop
$CALCULATOR = org.gnome.Calculator.desktop
$TERMINAL = Alacritty.desktop

# Fn keys
bind = , XF86Calculator,            exec, uwsm-app -- $CALCULATOR
bind = , XF86Tools,                 exec, uwsm-app -- $TERMINAL

# Keybindings
bind = $mainMod           , B, exec, uwsm-app -- $BROWSER
bind = $mainMod ALT       , B, exec, uwsm-app -- google-chrome-stable
bind = $mainMod           , C, exec, uwsm-app -- $EDITOR
bind = $mainMod           , E, exec, gapplication launch org.gnome.Nautilus
bind = $mainMod SHIFT     , E, exec, uwsm-app -- org.kde.dolphin.desktop
bind = $mainMod CTRL      , E, exec, uwsm-app -- $EMOJIPICKER
bind = $mainMod CTRL      , C, exec, uwsm-app -- $CALCULATOR

bind = $mainMod           , RETURN, exec, uwsm-app -- kitty -1
bind = $mainMod SHIFT     , Return, exec, uwsm-app -- com.mitchellh.ghostty.desktop
bind = $mainMod SHIFT CTRL, Return, exec, uwsm-app -- org.wezfurlong.wezterm.desktop
bind = CTRL ALT           , T     , exec, uwsm-app -- alacritty-sock.sh || alacritty-sock.sh


#wayscriber
bind = $mainMod ALT, D,         exec, pkill -SIGUSR1 wayscriber

bind = CTRL               , grave , global, com.mitchellh.ghostty:CTRL+grave


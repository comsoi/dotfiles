bind = SUPER, S ,exec, hyprctl dispatch submap ctl & sleep 3 && hyprctl dispatch submap reset
# will start a submap called "resize"
submap = ctl

# sets repeatable binds for resizing the active window
binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10

binde = , c, exec, ~/.local/bin/alacritty-sock.sh
binde = , h, movefocus, l
binde = , l, movefocus, r
binde = , k, movefocus, u
binde = , j, movefocus, d

binde = , n, workspace, e+1
binde = , p, workspace, e-1

binde = , 1, workspace, 1 # Open workspace 1
binde = , 2, workspace, 2 # Open workspace 2
binde = , 3, workspace, 3 # Open workspace 3
binde = , 4, workspace, 4 # Open workspace 4
binde = , 5, workspace, 5 # Open workspace 5
binde = , 6, workspace, 6 # Open workspace 6
binde = , 7, workspace, 7 # Open workspace 7
binde = , 8, workspace, 8 # Open workspace 8
binde = , 9, workspace, 9 # Open workspace 9
binde = , 0, workspace, 10 # Open workspace 10

binde = , 1, movetoworkspace, 1 # Move active window to workspace 1
binde = , 2, movetoworkspace, 2 # Move active window to workspace 2
binde = , 3, movetoworkspace, 3 # Move active window to workspace 3
binde = , 4, movetoworkspace, 4 # Move active window to workspace 4
binde = , 5, movetoworkspace, 5 # Move active window to workspace 5
binde = , 6, movetoworkspace, 6 # Move active window to workspace 6
binde = , 7, movetoworkspace, 7 # Move active window to workspace 7
binde = , 8, movetoworkspace, 8 # Move active window to workspace 8
binde = , 9, movetoworkspace, 9 # Move active window to workspace 9
binde = , 0, movetoworkspace, 10 # Move active window to workspace 10
binde = SUPER, Tab, changegroupactive, f
binde = SUPER SHIFT, Tab, changegroupactive, b
binde = , Tab, workspace, m+1 # Open next workspace
binde = SHIFT, Tab, workspace, m-1 # Open previous workspace

binde = CTRL, 1, exec, $HYPRSCRIPTS/moveTo.sh 1 # Move all windows to workspace 1
binde = CTRL, 2, exec, $HYPRSCRIPTS/moveTo.sh 2 # Move all windows to workspace 2
binde = CTRL, 3, exec, $HYPRSCRIPTS/moveTo.sh 3 # Move all windows to workspace 3
binde = CTRL, 4, exec, $HYPRSCRIPTS/moveTo.sh 4 # Move all windows to workspace 4
binde = CTRL, 5, exec, $HYPRSCRIPTS/moveTo.sh 5 # Move all windows to workspace 5
binde = CTRL, 6, exec, $HYPRSCRIPTS/moveTo.sh 6 # Move all windows to workspace 6
binde = CTRL, 7, exec, $HYPRSCRIPTS/moveTo.sh 7 # Move all windows to workspace 7
binde = CTRL, 8, exec, $HYPRSCRIPTS/moveTo.sh 8 # Move all windows to workspace 8
binde = CTRL, 9, exec, $HYPRSCRIPTS/moveTo.sh 9 # Move all windows to workspace 9
binde = CTRL, 0, exec, $HYPRSCRIPTS/moveTo.sh 10 # Move all windows to workspace 10

binde = , mouse_down, workspace, e+1 # Open next workspace
binde = , mouse_up, workspace, e-1 # Open previous workspace

# use reset to go back to the global submap
bind = , escape, submap, reset
bind = , q, submap, reset
bind = CTRL, c, submap, reset
bind = SUPER, escape, submap, reset

# will reset the submap, which will return to the global submap
submap = reset

# keybinds further down will be global again


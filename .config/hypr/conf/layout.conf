general {
	gaps_in = 10
	gaps_out = 14
	border_size = 2
	col.active_border = $color11
	col.inactive_border = rgba(ffffffff)
	layout = dwindle
	resize_on_border = true
	no_border_on_floating = true
	allow_tearing = true
}

group {
	groupbar {
		height = 16
		indicator_height = 2
		font_size = 16
		col.active = $color11
		col.inactive = rgba(ffffffff) # 0x66000000
		gaps_in = 10
	}
		# gap_tabbar = 0
	col.border_active = $color11
	col.border_inactive = rgba(ffffffff)
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    # Commented out due to compatibility reasons
    # new_status = master
}

binds {
  workspace_back_and_forth = true
  allow_workspace_cycles = true
  movefocus_cycles_fullscreen = 0
	disable_keybind_grabbing = true
}

xwayland {
  force_zero_scaling = true
}

misc {
    disable_hyprland_logo = true
    # disable_splash_rendering = true
}
